name: Release

# Cutting a release: git tag v0.1.0 && git push origin v0.1.0
# Builds self-contained binaries (no .NET/Node needed on the user's machine)
# and attaches them to a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      - name: Copy frontend into API wwwroot
        run: cp -r frontend/dist/finflow/browser backend/FinFlow.Api/wwwroot

      - name: Publish win-x64
        run: >
          dotnet publish backend/FinFlow.Api/FinFlow.Api.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:Version=${GITHUB_REF_NAME#v}
          -o out/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish backend/FinFlow.Api/FinFlow.Api.csproj -c Release -r linux-x64
          --self-contained -p:PublishSingleFile=true -p:Version=${GITHUB_REF_NAME#v}
          -o out/linux-x64

      - name: Write VERSION files
        run: |
          echo -n "$GITHUB_REF_NAME" > out/win-x64/VERSION
          echo -n "$GITHUB_REF_NAME" > out/linux-x64/VERSION

      - name: Package
        run: |
          (cd out/win-x64 && zip -qr "../../finflow-${GITHUB_REF_NAME}-win-x64.zip" .)
          (cd out/linux-x64 && tar czf "../../finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz" .)

      - name: Checksums
        run: |
          sha256sum "finflow-${GITHUB_REF_NAME}-win-x64.zip" | cut -d' ' -f1 > "finflow-${GITHUB_REF_NAME}-win-x64.zip.sha256"
          sha256sum "finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz" | cut -d' ' -f1 > "finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz.sha256"

      # Gate the release on an end-to-end smoke test of the exact artifact users will
      # download: unpack the tar.gz and run the shared assertions against the binary.
      # Any failed assertion fails the job — no release is created.
      - name: Smoke test the packaged app
        run: |
          mkdir /tmp/smoke
          tar xzf "finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C /tmp/smoke
          bash scripts/smoke-test.sh /tmp/smoke

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "finflow-${GITHUB_REF_NAME}-win-x64.zip"
          "finflow-${GITHUB_REF_NAME}-win-x64.zip.sha256"
          "finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          "finflow-${GITHUB_REF_NAME}-linux-x64.tar.gz.sha256"
          --title "FinFlow $GITHUB_REF_NAME" --generate-notes

  docker:
    # Only publish an image once the binaries it's built alongside are smoke-tested and
    # actually released — a failed release job must not leave a stray image on GHCR.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tosc2571/finflow:${{ github.ref_name }}
            ghcr.io/tosc2571/finflow:latest
