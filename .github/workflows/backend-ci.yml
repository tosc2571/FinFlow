name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'FinFlow.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'FinFlow.sln'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore FinFlow.sln
      - run: dotnet build FinFlow.sln --no-restore --configuration Release
      - run: dotnet test FinFlow.sln --no-build --configuration Release
