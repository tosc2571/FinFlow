<header class="topbar">
  <span class="brand">FinFlow</span>
  <button type="button" class="nav-toggle" (click)="toggleNav()" [attr.aria-expanded]="navOpen()" aria-label="Toggle navigation">
    ☰
  </button>
  <nav [class.open]="navOpen()">
    <a routerLink="/dashboard" routerLinkActive="active" (click)="closeNav()">Dashboard</a>
    <a routerLink="/transactions" routerLinkActive="active" (click)="closeNav()">Transactions</a>
    <a routerLink="/contracts" routerLinkActive="active" (click)="closeNav()">Contracts</a>
    <a routerLink="/import" routerLinkActive="active" (click)="closeNav()">Import</a>
    <a routerLink="/rules" routerLinkActive="active" (click)="closeNav()">Rules</a>
    <a routerLink="/categories" routerLinkActive="active" (click)="closeNav()">Categories</a>
    <a routerLink="/accounts" routerLinkActive="active" (click)="closeNav()">Accounts</a>
    <a routerLink="/settings" routerLinkActive="active" (click)="closeNav()">Settings</a>
  </nav>
</header>

@if (notifications.message(); as message) {
  <div class="error-banner" role="alert">
    <span>{{ message }}</span>
    <button type="button" (click)="notifications.clear()" aria-label="Dismiss">✕</button>
  </div>
}

<main>
  <router-outlet />
</main>
